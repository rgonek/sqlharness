name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/SqlHarness.Dashboard/ui/package-lock.json
      - run: npm ci --prefix src/SqlHarness.Dashboard/ui
      - run: npm run check --prefix src/SqlHarness.Dashboard/ui
      - run: dotnet build -warnaserror
      # One step per test project instead of one `dotnet test` over the solution, so the job
      # summary names the project that failed instead of "the test step". They run one after
      # another here on purpose: the runners charge for wall clock, and a green step that
      # hides a red one is worse than a slow log.
      - run: dotnet test tests/SqlHarness.Tests/SqlHarness.Tests.csproj --no-build --filter "FullyQualifiedName!~Integration" --logger trx --results-directory TestResults
      - run: dotnet test tests/SqlHarness.Mcp.Tests/SqlHarness.Mcp.Tests.csproj --no-build --filter "FullyQualifiedName!~Integration" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
      - run: dotnet format --no-restore --verify-no-changes
        if: matrix.os == 'ubuntu-latest'
      - run: Import-Module Pester -MaximumVersion 3.99; Invoke-Pester -Path tests/scripts -EnableExit
        if: matrix.os == 'windows-latest'
        shell: pwsh
