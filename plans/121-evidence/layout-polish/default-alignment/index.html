<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — default shadcn / mock</title>
<style>body{font:14px system-ui,sans-serif;margin:24px;color:#18181b;background:#fafafa}nav{display:flex;flex-wrap:wrap;gap:16px}section{margin-block:32px}h1{font-size:24px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px}img{width:100%;border:1px solid #ddd;background:white}a{color:inherit}p{max-width:90ch}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style>
<h1>Dashboard: default shadcn i aktualne mocki</h1>
<p>Świeże zrzuty aktualnego buildu z syntetycznymi danymi. Różnice danych ilustracyjnych nie są defektami. Kliknij obraz, aby otworzyć pełny rozmiar. <a href="report.md">Raport odstępstw i ocena opłacalności dopasowania</a>.</p>
<nav id="nav"></nav><main id="pairs"></main>
<script>
const views=[['Activity','activity-app','activity-mock'],['Session','session-app','session-mock'],['Session Details','session-details-app','session-details-mock'],['IO','session-io-app','session-io-mock'],['Plan','session-plan-app','session-plan-mock'],['Operation','operation-app','operation-mock'],['Profiles','profiles-app','profiles-mock'],['Usage','usage-app','usage-mock'],['Settings','settings-app','settings-mock'],['Mutation toast','mutation-toast-app','mutation-toast-mock'],['Mutation dialog','mutation-dialog-app','mutation-dialog-mock']];
for(const [title,app,mock] of views){const id=app;document.getElementById('nav').insertAdjacentHTML('beforeend',`<a href="#${id}">${title}</a>`);document.getElementById('pairs').insertAdjacentHTML('beforeend',`<section id="${id}"><h2>${title}</h2><div class="pair">${[['Aktualna aplikacja',app],['Mock',mock]].map(([label,file])=>`<figure><figcaption>${label}</figcaption><a href="${file}.png"><img loading="lazy" src="${file}.png" alt="${title}: ${label}"></a></figure>`).join('')}</div></section>`)}
</script></html>
